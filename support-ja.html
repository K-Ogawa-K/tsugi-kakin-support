    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }

<body>
  <h1>「次の課金」サポート</h1>
  <p>「次の課金」は、次にいつ、何のサブスクでお金が取られるかをすぐ確認するためのアプリです。</p>

  <h2>よくある操作</h2>
  <ul>
    <li>ホーム右上の「＋」からサブスクを登録できます。</li>
    <li>登録済みの項目をタップすると、詳細確認と編集ができます。</li>
    <li>解約済みの項目は設定の「解約済みのサブスク」から復元または完全削除できます。</li>
    <li>通知を使う場合は、登録・編集時に通知を選択し、iOSの通知許可を有効にしてください。</li>
  </ul>

  <h2>お問い合わせ</h2>
  <p class="note">公開連絡先は現在準備中です。App Store公開時に実在する連絡先を掲載します。</p>
</body>
